<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #0d0d0f;
            color: #ffffff;
        }

        body {
            min-height: 100vh;
        }

        /* =========================
           MAIN PAGE
           ========================= */

        .css-page {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 24px;
        }

        .css-title {
            margin: 0 0 30px;
            font-size: 36px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -1.5px;
        }

        .css-forms {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .css-form {
            position: relative;
            width: 100%;
        }

        .css-form-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .css-form-id {
            color: #756d7c;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .css-fields {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .css-field {
            display: grid;
            grid-template-columns: 1fr 100px;
            align-items: center;
            min-height: 58px;
            padding: 0 10px 0 16px;
            border: 1px solid #30263d;
            border-radius: 14px;
            background: #151217;
        }

        .css-label {
            color: #756d7c;
            font-size: 13px;
            font-weight: 700;
        }

        .css-input {
            width: 100%;
            height: 44px;
            border: 1px solid #30263d;
            border-radius: 10px;
            outline: none;
            background: #0d0d0f;
            color: #ffffff;
            font-size: 21px;
            font-weight: 900;
            text-align: center;
        }

        .css-input:focus {
            border-color: #7c3aed;
        }

        .css-start {
            width: 100%;
            height: 58px;
            margin-top: 10px;
            border: 0;
            border-radius: 14px;
            background: #22c55e;
            color: #07130b;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
        }

        .css-start:hover {
            background: #4ade80;
        }

        .css-start:active {
            transform: translateY(1px);
        }

        .css-add {
            width: 100%;
            height: 64px;
            margin-top: 34px;
            border: 2px dashed #7c3aed;
            border-radius: 15px;
            background: transparent;
            color: #c4b5fd;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
        }

        .css-add:hover {
            background: #17131f;
        }


        /* =========================
           TIMER SCREEN
           ========================= */

        .css-screen-timer {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0d0d0f;
        }

        .css-screen-timer.css-active {
            display: flex;
        }

        .css-timer-content {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .css-phase {
            min-height: 29px;
            margin-bottom: 30px;
            color: #c4b5fd;
            font-size: 24px;
            font-weight: 800;
        }

        .css-circle {
            position: relative;
            width: min(78vw, 330px);
            height: min(78vw, 330px);
            margin: 0 auto;
        }

        .css-circle-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .css-circle-background {
            fill: none;
            stroke: #28232d;
            stroke-width: 12;
        }

        .css-circle-progress {
            fill: none;
            stroke: #7c3aed;
            stroke-width: 12;
            stroke-linecap: round;
        }

        .css-circle-center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .css-countdown {
            font-size: 76px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -4px;
        }

        .css-success {
            color: #22c55e;
            font-size: 42px;
            font-weight: 900;
        }

        .css-repeat {
            margin-top: 30px;
            color: #756d7c;
            font-size: 16px;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <!-- =========================
         SCREEN 1
         ========================= -->

    <main class="css-page">

        <h1 class="css-title">
            Exercise
        </h1>

        <div class="css-forms js-forms"></div>

        <button
            class="css-add js-add"
            type="button"
        >
            + Add
        </button>

    </main>


    <!-- =========================
         SCREEN 2
         ========================= -->

    <section class="css-screen-timer js-timer-screen">

        <div class="css-timer-content">

            <div class="css-phase js-phase">
                Hold
            </div>

            <div class="css-circle">

                <svg
                    class="css-circle-svg"
                    viewBox="0 0 300 300"
                >
                    <circle
                        class="css-circle-background"
                        cx="150"
                        cy="150"
                        r="135"
                    ></circle>

                    <circle
                        class="css-circle-progress js-progress"
                        cx="150"
                        cy="150"
                        r="135"
                    ></circle>
                </svg>

                <div class="css-circle-center">

                    <div class="css-countdown js-countdown">
                        1
                    </div>

                    <div
                        class="css-success js-success"
                        hidden
                    >
                        Success!
                    </div>

                </div>

            </div>

            <div class="css-repeat js-repeat">
                Repeat 1 / 1
            </div>

        </div>

    </section>


    <script>
        /*
         * =========================
         * STORAGE
         * =========================
         */

        const STORAGE_KEY = 'exercises';

        const formsContainer =
            document.querySelector('.js-forms');

        const addButton =
            document.querySelector('.js-add');

        const timerScreen =
            document.querySelector('.js-timer-screen');

        const phaseDisplay =
            document.querySelector('.js-phase');

        const countdownDisplay =
            document.querySelector('.js-countdown');

        const successDisplay =
            document.querySelector('.js-success');

        const repeatDisplay =
            document.querySelector('.js-repeat');

        const progress =
            document.querySelector('.js-progress');


        /*
         * =========================
         * TIMER
         * =========================
         */

        const radius = 135;

        const circumference =
            2 * Math.PI * radius;

        progress.style.strokeDasharray =
            circumference;

        let timer = null;


        /*
         * =========================
         * LOAD / SAVE
         * =========================
         */

        function loadForms() {

            const stored =
                localStorage.getItem(STORAGE_KEY);

            if (!stored) {
                return {};
            }

            try {
                return JSON.parse(stored);
            } catch (error) {
                return {};
            }
        }


        function saveForms(forms) {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(forms)
            );
        }


        /*
         * =========================
         * CREATE FORM
         * =========================
         */

        function createForm(id, data) {

            const form = document.createElement('div');

            form.className = 'css-form';

            form.dataset.id = id;

            form.innerHTML = `
                <div class="css-form-header">
                    <div class="css-form-id">
                        Exercise ${id}
                    </div>
                </div>

                <div class="css-fields">

                    <div class="css-field">
                        <label class="css-label">
                            Hold
                        </label>

                        <input
                            class="css-input js-hold"
                            type="number"
                            min="1"
                            step="1"
                            value="${data.hold}"
                        >
                    </div>

                    <div class="css-field">
                        <label class="css-label">
                            Rest
                        </label>

                        <input
                            class="css-input js-rest"
                            type="number"
                            min="1"
                            step="1"
                            value="${data.rest}"
                        >
                    </div>

                    <div class="css-field">
                        <label class="css-label">
                            Repeat
                        </label>

                        <input
                            class="css-input js-repeat-input"
                            type="number"
                            min="1"
                            step="1"
                            value="${data.repeat}"
                        >
                    </div>

                </div>

                <button
                    class="css-start js-start"
                    type="button"
                >
                    Start
                </button>
            `;


            /*
             * Save this form whenever
             * one of its fields changes.
             */

            const inputs =
                form.querySelectorAll('.js-hold, .js-rest, .js-repeat-input');

            inputs.forEach(input => {

                input.addEventListener('input', () => {

                    saveForm(form);

                });

                input.addEventListener('change', () => {

                    saveForm(form);

                });

            });


            /*
             * Start button belongs
             * only to this form.
             */

            const startButton =
                form.querySelector('.js-start');

            startButton.addEventListener(
                'click',
                () => {

                    saveForm(form);

                    const settings =
                        getFormSettings(form);

                    startExercise(settings);

                }
            );


            formsContainer.appendChild(form);
        }


        function getFormSettings(form) {

            return {
                hold: Math.max(
                    1,
                    Math.floor(
                        Number(
                            form.querySelector('.js-hold').value
                        ) || 1
                    )
                ),

                rest: Math.max(
                    1,
                    Math.floor(
                        Number(
                            form.querySelector('.js-rest').value
                        ) || 1
                    )
                ),

                repeat: Math.max(
                    1,
                    Math.floor(
                        Number(
                            form.querySelector('.js-repeat-input').value
                        ) || 1
                    )
                )
            };
        }


        function saveForm(form) {

            const forms = loadForms();

            const id = form.dataset.id;

            forms[id] =
                getFormSettings(form);

            saveForms(forms);
        }


        /*
         * =========================
         * ADD FORM
         * =========================
         */

        function getNextId() {

            const forms = loadForms();

            const ids =
                Object.keys(forms)
                    .map(Number)
                    .filter(Number.isFinite);

            if (ids.length === 0) {
                return 1;
            }

            return Math.max(...ids) + 1;
        }


        addButton.addEventListener('click', () => {

            const id = getNextId();

            const data = {
                hold: 1,
                rest: 1,
                repeat: 1
            };

            const forms = loadForms();

            forms[id] = data;

            saveForms(forms);

            createForm(id, data);

        });


        /*
         * =========================
         * RESTORE FORMS
         * =========================
         */

        function restoreForms() {

            const forms = loadForms();

            const ids =
                Object.keys(forms)
                    .sort((a, b) => Number(a) - Number(b));

            if (ids.length === 0) {

                const data = {
                    hold: 1,
                    rest: 1,
                    repeat: 1
                };

                forms[1] = data;

                saveForms(forms);

                createForm(1, data);

                return;
            }

            ids.forEach(id => {

                createForm(
                    id,
                    forms[id]
                );

            });
        }


        /*
         * =========================
         * START EXERCISE
         * =========================
         */

        function startExercise(settings) {

            clearInterval(timer);

            timerScreen.classList.add(
                'css-active'
            );

            successDisplay.hidden = true;
            countdownDisplay.hidden = false;

            runRepeat(
                1,
                settings.repeat,
                settings.hold,
                settings.rest
            );
        }


        /*
         * =========================
         * REPEAT
         * =========================
         */

        function runRepeat(
            currentRepeat,
            totalRepeats,
            hold,
            rest
        ) {

            repeatDisplay.textContent =
                `Repeat ${currentRepeat} / ${totalRepeats}`;


            runPhase(
                'Hold',
                hold,
                () => {

                    runPhase(
                        'Rest',
                        rest,
                        () => {

                            if (
                                currentRepeat <
                                totalRepeats
                            ) {

                                runRepeat(
                                    currentRepeat + 1,
                                    totalRepeats,
                                    hold,
                                    rest
                                );

                            } else {

                                showSuccess();

                            }

                        }
                    );

                }
            );
        }


        /*
         * =========================
         * TIMER PHASE
         * =========================
         */

        function runPhase(
            phase,
            duration,
            onComplete
        ) {

            clearInterval(timer);

            phaseDisplay.textContent =
                phase;

            countdownDisplay.hidden =
                false;

            successDisplay.hidden =
                true;

            const startTime =
                Date.now();

            const durationMs =
                duration * 1000;


            function update() {

                const elapsed =
                    Date.now() - startTime;

                const remainingMs =
                    Math.max(
                        0,
                        durationMs - elapsed
                    );

                const remainingSeconds =
                    Math.ceil(
                        remainingMs / 1000
                    );

                countdownDisplay.textContent =
                    remainingSeconds;


                const progressAmount =
                    1 -
                    (remainingMs / durationMs);

                progress.style.strokeDashoffset =
                    circumference *
                    progressAmount;


                if (remainingMs <= 0) {

                    clearInterval(timer);

                    progress.style.strokeDashoffset =
                        circumference;

                    onComplete();
                }
            }


            update();

            timer =
                setInterval(update, 50);
        }


        /*
         * =========================
         * SUCCESS
         * =========================
         */

        function showSuccess() {

            clearInterval(timer);

            phaseDisplay.textContent = '';

            countdownDisplay.hidden =
                true;

            successDisplay.hidden =
                false;

            progress.style.strokeDashoffset =
                circumference;

            repeatDisplay.textContent =
                '';


            setTimeout(() => {

                timerScreen.classList.remove(
                    'css-active'
                );

                countdownDisplay.hidden =
                    false;

                successDisplay.hidden =
                    true;

                phaseDisplay.textContent =
                    'Hold';

                progress.style.strokeDashoffset =
                    0;

            }, 1800);
        }


        /*
         * =========================
         * INITIALIZE
         * =========================
         */

        restoreForms();

    </script>

</body>
</html>

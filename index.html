<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #0d0d0f;
            color: #ffffff;
        }

        body {
            min-height: 100vh;
        }


        /* =========================
           MAIN PAGE
           ========================= */

        .css-page {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 24px;
        }

        .css-title {
            margin: 0 0 30px;
            font-size: 36px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -1.5px;
        }

        .css-forms {
            display: flex;
            flex-direction: column;
            gap: 34px;
        }

        .css-form {
            position: relative;
            width: 100%;
        }

        .css-form-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .css-form-id {
            color: #756d7c;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .css-form-id.css-exercise-name { cursor: pointer; }
        .css-form-id.css-exercise-name:hover { color: #c4b5fd; }

        .css-delete-modal { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(0,0,0,.72); }
        .css-delete-modal.css-active { display: flex; }
        .css-delete-dialog { width: 100%; max-width: 360px; padding: 24px; border: 1px solid #30263d; border-radius: 18px; background: #151217; text-align: center; }
        .css-delete-title { margin: 0 0 10px; font-size: 24px; font-weight: 900; }
        .css-delete-text { margin: 0 0 22px; color: #a99bb5; font-size: 15px; line-height: 1.45; }
        .css-delete-actions { display: flex; gap: 8px; }
        .css-delete-cancel, .css-delete-confirm { flex: 1; height: 50px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; }
        .css-delete-cancel { border: 1px solid #30263d; background: #0d0d0f; color: #fff; }
        .css-delete-confirm { background: #ef4444; color: #fff; }

        .css-form-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .css-graph {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 34px;
            padding: 0 9px;
            border: 1px solid #30263d;
            border-radius: 9px;
            background: #151217;
            color: #a99bb5;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .css-graph:hover {
            border-color: #7c3aed;
            color: #c4b5fd;
        }

        .css-graph-icon {
            width: 15px;
            height: 15px;
        }

        .css-fields {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .css-field {
            display: grid;
            grid-template-columns: 1fr 100px;
            align-items: center;
            min-height: 58px;
            padding: 0 10px 0 16px;
            border: 1px solid #30263d;
            border-radius: 14px;
            background: #151217;
        }

        .css-label {
            color: #756d7c;
            font-size: 16px;
            font-weight: 700;
        }

        .css-input {
            width: 100%;
            height: 44px;
            border: 1px solid #30263d;
            border-radius: 10px;
            outline: none;
            background: #0d0d0f;
            color: #ffffff;
            font-size: 21px;
            font-weight: 900;
            text-align: center;
        }

        .css-input:focus {
            border-color: #7c3aed;
        }

        .css-start {
            width: 100%;
            height: 58px;
            margin-top: 10px;
            border: 0;
            border-radius: 14px;
            background: #22c55e;
            color: #07130b;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
        }

        .css-start:hover {
            background: #4ade80;
        }

        .css-start:active {
            transform: translateY(1px);
        }


        /* =========================
           DAILY GOAL
           ========================= */

        .css-progress {
            display: flex;
            align-items: center;
            gap: 5px;
            width: 100%;
            height: 12px;
            margin-top: 12px;
        }

        .css-progress-section {
            flex: 1;
            min-width: 0;
            height: 10px;
            border: 1px dotted #5a5a5f;
            border-radius: 3px;
            background: transparent;
        }

        .css-progress-section.css-done {
            border: 0;
            background: #8a8a8f;
        }

        .css-progress-section.css-complete {
            border: 0;
            background: #22c55e;
        }

        .css-progress-check {
            flex: 0 0 auto;
            color: #22c55e;
            font-size: 18px;
            line-height: 1;
            font-weight: 900;
        }

        .css-goal-text {
            margin-top: 7px;
            color: #756d7c;
            font-size: 12px;
            font-weight: 700;
            text-align: right;
        }


        /* =========================
           ADD BUTTON
           ========================= */

        .css-add {
            width: 100%;
            height: 64px;
            margin-top: 34px;
            border: 2px dashed #7c3aed;
            border-radius: 15px;
            background: transparent;
            color: #c4b5fd;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
        }

        .css-add:hover {
            background: #17131f;
        }


        /* =========================
           TIMER SCREEN
           ========================= */

        .css-screen-timer {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0d0d0f;
        }

        .css-screen-timer.css-active {
            display: flex;
        }

        .css-timer-content {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .css-phase {
            min-height: 29px;
            margin-bottom: 30px;
            color: #c4b5fd;
            font-size: 28px;
            font-weight: 800;
        }

        .css-circle {
            position: relative;
            width: min(78vw, 330px);
            height: min(78vw, 330px);
            margin: 0 auto;
            border-radius: 50%;
            transition: background-color 0.2s ease;
        }

        .css-circle.css-hold {
            background: #facc15;
        }

        .css-circle.css-rest {
            background: #22c55e;
        }

        .css-circle.css-ready {
            background: #28232d;
            
        }
        .css-circle.css-ready .css-countdown{
            color: white;
        }

        .css-circle-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .css-circle-background {
            fill: none;
            stroke: rgba(0, 0, 0, 0.18);
            stroke-width: 12;
        }

        .css-circle-progress {
            fill: none;
            stroke: #ffffff;
            stroke-width: 12;
            stroke-linecap: round;
        }

        .css-circle-center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .css-countdown {
            color: #111111;
            font-size: 76px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -4px;
        }

        .css-ready-text {
            color: #ffffff;
            font-size: 42px;
            font-weight: 900;
        }

        .css-success {
            color: #22c55e;
            font-size: 42px;
            font-weight: 900;
        }

        .css-repeat {
            margin-top: 30px;
            color: #756d7c;
            font-size: 24px;
            font-weight: 700;
        }


        /* =========================
           STATISTICS SCREEN
           ========================= */

        .css-screen-statistics {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: none;
            overflow-y: auto;
            background: #0d0d0f;
        }

        .css-screen-statistics.css-active {
            display: block;
        }

        .css-statistics-content {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 24px;
        }

        .css-statistics-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .css-statistics-title {
            margin: 0;
            font-size: 32px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .css-close {
            width: 42px;
            height: 42px;
            border: 1px solid #30263d;
            border-radius: 12px;
            background: #151217;
            color: #ffffff;
            font-size: 25px;
            line-height: 1;
            cursor: pointer;
        }

        .css-statistics-subtitle {
            margin: 0 0 22px;
            color: #756d7c;
            font-size: 14px;
            font-weight: 700;
        }

        .css-calendar {
            border: 1px solid #30263d;
            border-radius: 16px;
            padding: 16px;
            background: #151217;
        }

        .css-calendar-month {
            margin-bottom: 18px;
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
        }

        .css-calendar-weekdays,
        .css-calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .css-calendar-weekday {
            color: #756d7c;
            font-size: 10px;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
        }

        .css-calendar-day {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            min-width: 0;
            border-radius: 8px;
            color: #77777d;
            font-size: 13px;
            font-weight: 800;
        }

        .css-calendar-day.css-day-complete {
            background: #22c55e;
            color: #07130b;
            margin: 5px;
        }

        .css-calendar-day.css-day-today {
            outline: 1px solid #7c3aed;
            outline-offset: 2px;
        }

        .css-calendar-day.css-empty {
            visibility: hidden;
        }

        .css-statistics-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .css-statistic {
            padding: 16px;
            border: 1px solid #30263d;
            border-radius: 14px;
            background: #151217;
        }

        .css-statistic-label {
            color: #756d7c;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .css-statistic-value {
            margin-top: 5px;
            font-size: 26px;
            font-weight: 900;
        }
    </style>
</head>

<body>

    <!-- =========================
         SCREEN 1
         ========================= -->

    <main class="css-page">

        <h1 class="css-title">
            Exercise
        </h1>

        <div class="css-forms js-forms"></div>

        <button
            class="css-add js-add"
            type="button"
        >
            + Add
        </button>

    </main>


    <!-- =========================
         SCREEN 2 - TIMER
         ========================= -->

    <section class="css-screen-timer js-timer-screen">

        <div class="css-timer-content">

            <div class="css-phase js-phase">
                Ready?
            </div>

            <div class="css-circle css-ready js-circle">

                <svg
                    class="css-circle-svg"
                    viewBox="0 0 300 300"
                >
                    <circle
                        class="css-circle-background"
                        cx="150"
                        cy="150"
                        r="135"
                    ></circle>

                    <circle
                        class="css-circle-progress js-progress"
                        cx="150"
                        cy="150"
                        r="135"
                    ></circle>
                </svg>

                <div class="css-circle-center">

                    <div class="css-countdown js-countdown">
                        3
                    </div>

                    <div
                        class="css-ready-text js-ready-text"
                        hidden
                    >
                        Ready?
                    </div>

                    <div
                        class="css-success js-success"
                        hidden
                    >
                        Success!
                    </div>

                </div>

            </div>

            <div class="css-repeat js-repeat">
                Repeat 1 / 1
            </div>

        </div>

    </section>


    <!-- =========================
         SCREEN 3 - STATISTICS
         ========================= -->

    <section class="css-screen-statistics js-statistics-screen">

        <div class="css-statistics-content">

            <div class="css-statistics-header">

                <h2 class="css-statistics-title js-statistics-title">
                    Statistics
                </h2>

                <button
                    class="css-close js-close-statistics"
                    type="button"
                    aria-label="Close statistics"
                >
                    ×
                </button>

            </div>

            <p class="css-statistics-subtitle js-statistics-subtitle">
                Day goal
            </p>

            <div class="css-calendar">

                <div class="css-calendar-month js-calendar-month">
                    Month
                </div>

                <div class="css-calendar-weekdays">

                    <div class="css-calendar-weekday">Mon</div>
                    <div class="css-calendar-weekday">Tue</div>
                    <div class="css-calendar-weekday">Wed</div>
                    <div class="css-calendar-weekday">Thu</div>
                    <div class="css-calendar-weekday">Fri</div>
                    <div class="css-calendar-weekday">Sat</div>
                    <div class="css-calendar-weekday">Sun</div>

                </div>

                <div class="css-calendar-days js-calendar-days"></div>

            </div>

            <div class="css-statistics-summary">

                <div class="css-statistic">

                    <div class="css-statistic-label">
                        Achieved
                    </div>

                    <div class="css-statistic-value js-achieved">
                        0
                    </div>

                </div>

                <div class="css-statistic">

                    <div class="css-statistic-label">
                        Days
                    </div>

                    <div class="css-statistic-value js-total-days">
                        0
                    </div>

                </div>

            </div>

        </div>

    </section>

    <div class="css-delete-modal js-delete-modal" role="dialog" aria-modal="true">
        <div class="css-delete-dialog">
            <h3 class="css-delete-title">Delete exercise?</h3>
            <p class="css-delete-text js-delete-text"></p>
            <div class="css-delete-actions">
                <button class="css-delete-cancel js-delete-cancel" type="button">Cancel</button>
                <button class="css-delete-confirm js-delete-confirm" type="button">Delete</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY =
            'Exercises';

        const formsContainer =
            document.querySelector('.js-forms');

        const addButton =
            document.querySelector('.js-add');

        const timerScreen =
            document.querySelector('.js-timer-screen');

        const statisticsScreen =
            document.querySelector('.js-statistics-screen');

        const phaseDisplay =
            document.querySelector('.js-phase');

        const countdownDisplay =
            document.querySelector('.js-countdown');

        const readyDisplay =
            document.querySelector('.js-ready-text');

        const successDisplay =
            document.querySelector('.js-success');

        const repeatDisplay =
            document.querySelector('.js-repeat');

        const progress =
            document.querySelector('.js-progress');

        const circle =
            document.querySelector('.js-circle');

        const statisticsTitle =
            document.querySelector('.js-statistics-title');

        const statisticsSubtitle =
            document.querySelector('.js-statistics-subtitle');

        const calendarMonth =
            document.querySelector('.js-calendar-month');

        const calendarDays =
            document.querySelector('.js-calendar-days');

        const achievedDisplay =
            document.querySelector('.js-achieved');

        const totalDaysDisplay =
            document.querySelector('.js-total-days');

        const closeStatisticsButton =
            document.querySelector('.js-close-statistics');

        const deleteModal = document.querySelector('.js-delete-modal');
        const deleteText = document.querySelector('.js-delete-text');
        const cancelDeleteButton = document.querySelector('.js-delete-cancel');
        const confirmDeleteButton = document.querySelector('.js-delete-confirm');
        let exerciseToDelete = null;

        const radius = 135;

        const circumference =
            2 * Math.PI * radius;

        progress.style.strokeDasharray =
            circumference;

        let timer = null;


        /* =========================
           STORAGE
           ========================= */

        function loadForms() {

            const stored =
                localStorage.getItem(STORAGE_KEY);

            if (!stored) {
                return {};
            }

            try {
                return JSON.parse(stored);
            } catch (error) {
                return {};
            }
        }


        function saveForms(forms) {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(forms)
            );
        }


        function getToday() {

            const now =
                new Date();

            const year =
                now.getFullYear();

            const month =
                String(
                    now.getMonth() + 1
                ).padStart(2, '0');

            const day =
                String(
                    now.getDate()
                ).padStart(2, '0');

            return `${year}-${month}-${day}`;
        }


        /* =========================
           FORM SETTINGS
           ========================= */

        function getFormSettings(form) {

            const hold =
                Math.max(
                    1,
                    Math.floor(
                        Number(
                            form.querySelector(
                                '.js-hold'
                            ).value
                        ) || 1
                    )
                );

            const rest =
                Math.max(
                    1,
                    Math.floor(
                        Number(
                            form.querySelector(
                                '.js-rest'
                            ).value
                        ) || 1
                    )
                );

            const repeat =
                Math.max(
                    1,
                    Math.floor(
                        Number(
                            form.querySelector(
                                '.js-repeat-input'
                            ).value
                        ) || 1
                    )
                );

            const goalInput =
                form.querySelector(
                    '.js-day-goal'
                );

            const dayGoal =
                goalInput.value.trim() === ''
                    ? null
                    : Math.max(
                        1,
                        Math.floor(
                            Number(
                                goalInput.value
                            ) || 1
                        )
                    );

            return {
                hold,
                rest,
                repeat,
                dayGoal
            };
        }


        function saveForm(form) {

            const forms =
                loadForms();

            const id =
                form.dataset.id;

            const oldData =
                forms[id] || {};

            forms[id] = {
                ...oldData,
                ...getFormSettings(form)
            };

            saveForms(forms);

            updateProgress(form);
        }


        /* =========================
           DAILY PROGRESS
           ========================= */

        function getTodayCount(data) {

            const today =
                getToday();

            if (!data.history) {
                return 0;
            }

            return Number(
                data.history[today] || 0
            );
        }


        function increaseTodayCount(id) {

            const forms =
                loadForms();

            if (!forms[id]) {
                return;
            }

            const today =
                getToday();

            if (!forms[id].history) {
                forms[id].history = {};
            }

            forms[id].history[today] =
                Number(
                    forms[id].history[today] || 0
                ) + 1;

            saveForms(forms);
        }


        function updateProgress(form) {

            const id =
                form.dataset.id;

            const forms =
                loadForms();

            const data =
                forms[id];

            const progressContainer =
                form.querySelector(
                    '.js-progress'
                );

            const goalText =
                form.querySelector(
                    '.js-goal-text'
                );

            progressContainer.innerHTML =
                '';

            if (
                !data ||
                !data.dayGoal
            ) {

                progressContainer.hidden =
                    true;

                goalText.hidden =
                    true;

                return;
            }

            progressContainer.hidden =
                false;

            goalText.hidden =
                false;

            const goal =
                Number(data.dayGoal);

            const completed =
                getTodayCount(data);

            const reachedGoal =
                completed >= goal;


            for (
                let i = 0;
                i < goal;
                i++
            ) {

                const section =
                    document.createElement(
                        'div'
                    );

                section.className =
                    'css-progress-section';


                if (reachedGoal) {

                    section.classList.add(
                        'css-complete'
                    );

                } else if (
                    i < completed
                ) {

                    section.classList.add(
                        'css-done'
                    );
                }


                progressContainer.appendChild(
                    section
                );
            }


            if (reachedGoal) {

                const check =
                    document.createElement(
                        'div'
                    );

                check.className =
                    'css-progress-check';

                check.textContent =
                    '✓';

                progressContainer.appendChild(
                    check
                );
            }


            goalText.textContent =
                `${Math.min(
                    completed,
                    goal
                )} / ${goal} today`;
        }


        /* =========================
           CREATE FORM
           ========================= */

        function createForm(id, data) {

            const form =
                document.createElement(
                    'div'
                );

            form.className =
                'css-form';

            form.dataset.id =
                id;


            form.innerHTML = `

                <div class="css-form-header">

                    <div class="css-form-id css-exercise-name js-exercise-name" role="button" tabindex="0" title="Delete exercise">
                        Exercise ${id}
                    </div>

                    <div class="css-form-actions">

                        <button
                            class="css-graph js-graph"
                            type="button"
                            aria-label="View statistics"
                        >

                            <svg
                                class="css-graph-icon"
                                viewBox="0 0 20 20"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M3 17V9"></path>
                                <path d="M8 17V5"></path>
                                <path d="M13 17V11"></path>
                                <path d="M18 17V3"></path>
                            </svg>

                            Graph

                        </button>

                    </div>

                </div>


                <div class="css-fields">

                    <div class="css-field">

                        <label class="css-label">
                            Hold
                        </label>

                        <input
                            class="css-input js-hold"
                            type="number"
                            min="1"
                            step="1"
                            value="${data.hold ?? 1}"
                        >

                    </div>


                    <div class="css-field">

                        <label class="css-label">
                            Rest
                        </label>

                        <input
                            class="css-input js-rest"
                            type="number"
                            min="1"
                            step="1"
                            value="${data.rest ?? 1}"
                        >

                    </div>


                    <div class="css-field">

                        <label class="css-label">
                            Repeat
                        </label>

                        <input
                            class="css-input js-repeat-input"
                            type="number"
                            min="1"
                            step="1"
                            value="${data.repeat ?? 1}"
                        >

                    </div>


                    <div class="css-field">

                        <label class="css-label">
                            Day goal
                        </label>

                        <input
                            class="css-input js-day-goal"
                            type="number"
                            min="1"
                            step="1"
                            placeholder="—"
                            value="${data.dayGoal ?? ''}"
                        >

                    </div>

                </div>


                <div
                    class="css-progress js-progress"
                ></div>


                <div
                    class="css-goal-text js-goal-text"
                ></div>


                <button
                    class="css-start js-start"
                    type="button"
                >
                    Start
                </button>
            `;


            const inputs =
                form.querySelectorAll(
                    '.js-hold, ' +
                    '.js-rest, ' +
                    '.js-repeat-input, ' +
                    '.js-day-goal'
                );


            inputs.forEach(input => {

                input.addEventListener(
                    'input',
                    () => {
                        saveForm(form);
                    }
                );

                input.addEventListener(
                    'change',
                    () => {
                        saveForm(form);
                    }
                );

            });


            const startButton =
                form.querySelector(
                    '.js-start'
                );


            startButton.addEventListener(
                'click',
                () => {

                    saveForm(form);

                    const settings =
                        getFormSettings(form);

                    const id =
                        form.dataset.id;

                    increaseTodayCount(id);

                    updateProgress(form);

                    startExercise(
                        settings
                    );
                }
            );


            const graphButton =
                form.querySelector(
                    '.js-graph'
                );


            graphButton.addEventListener(
                'click',
                () => {

                    showStatistics(id);
                }
            );


            const exerciseName = form.querySelector('.js-exercise-name');
            exerciseName.addEventListener('click', () => showDeleteExerciseDialog(id));
            exerciseName.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    showDeleteExerciseDialog(id);
                }
            });

            formsContainer.appendChild(
                form
            );

            updateProgress(form);
        }


        /* =========================
           DELETE EXERCISE
           ========================= */

        function showDeleteExerciseDialog(id) {
            exerciseToDelete = id;
            deleteText.textContent = `Exercise ${id} and all of its statistics data will be deleted from local storage.`;
            deleteModal.classList.add('css-active');
            cancelDeleteButton.focus();
        }

        function closeDeleteExerciseDialog() {
            exerciseToDelete = null;
            deleteModal.classList.remove('css-active');
        }

        function deleteExercise() {
            if (exerciseToDelete === null) return;
            const id = String(exerciseToDelete);
            const forms = loadForms();
            delete forms[id];
            saveForms(forms);
            const form = Array.from(formsContainer.querySelectorAll('.css-form')).find(el => el.dataset.id === id);
            if (form) form.remove();
            closeDeleteExerciseDialog();
        }

        confirmDeleteButton.addEventListener('click', deleteExercise);
        cancelDeleteButton.addEventListener('click', closeDeleteExerciseDialog);
        deleteModal.addEventListener('click', event => {
            if (event.target === deleteModal) closeDeleteExerciseDialog();
        });


        /* =========================
           STATISTICS
           ========================= */

        function showStatistics(id) {

            const forms =
                loadForms();

            const data =
                forms[id];

            if (!data) {
                return;
            }

            statisticsTitle.textContent =
                `Exercise ${id}`;

            if (data.dayGoal) {

                statisticsSubtitle.textContent =
                    `Daily goal: ${data.dayGoal} exercises`;

            } else {

                statisticsSubtitle.textContent =
                    'No daily goal set';

            }

            renderCalendar(data);

            statisticsScreen.classList.add(
                'css-active'
            );
        }


        function renderCalendar(data) {

            calendarDays.innerHTML =
                '';

            const now =
                new Date();

            /*
             * Show the previous calendar month.
             */
            const year =
                now.getFullYear();

            const month =
                now.getMonth() ;

            const firstDay =
                new Date(
                    year,
                    month,
                    1
                );

            const lastDay =
                new Date(
                    year,
                    month + 1,
                    0
                );

            const daysInMonth =
                lastDay.getDate();

            let firstWeekday =
                firstDay.getDay();

            /*
             * Convert Sunday=0 to
             * Monday=0.
             */
            firstWeekday =
                firstWeekday === 0
                    ? 6
                    : firstWeekday - 1;


            calendarMonth.textContent =
                firstDay.toLocaleDateString(
                    undefined,
                    {
                        month: 'long',
                        year: 'numeric'
                    }
                );


            /*
             * Empty cells before
             * the first day.
             */
            for (
                let i = 0;
                i < firstWeekday;
                i++
            ) {

                const empty =
                    document.createElement(
                        'div'
                    );

                empty.className =
                    'css-calendar-day css-empty';

                calendarDays.appendChild(
                    empty
                );
            }


            let achieved = 0;


            for (
                let day = 1;
                day <= daysInMonth;
                day++
            ) {

                const date =
                    new Date(
                        year,
                        month,
                        day
                    );

                const dateString =
                    formatDate(date);

                const count =
                    data.history &&
                    data.history[dateString]
                        ? Number(
                            data.history[
                                dateString
                            ]
                        )
                        : 0;

                const goal =
                    Number(
                        data.dayGoal || 0
                    );

                const complete =
                    goal > 0 &&
                    count >= goal;


                if (complete) {
                    achieved++;
                }


                const dayElement =
                    document.createElement(
                        'div'
                    );

                dayElement.className =
                    'css-calendar-day';

                if (complete) {

                    dayElement.classList.add(
                        'css-day-complete'
                    );

                    dayElement.textContent =
                        '✓';

                    dayElement.title =
                        `${dateString}: goal achieved`;

                } else {

                    dayElement.textContent =
                        day;

                    if (goal > 0) {

                        dayElement.title =
                            `${dateString}: ${count} / ${goal}`;
                    }
                }


                if (
                    dateString === getToday()
                ) {

                    dayElement.classList.add(
                        'css-day-today'
                    );
                }


                calendarDays.appendChild(
                    dayElement
                );
            }


            achievedDisplay.textContent =
                achieved;

            totalDaysDisplay.textContent =
                daysInMonth;
        }


        function formatDate(date) {

            const year =
                date.getFullYear();

            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, '0');

            const day =
                String(
                    date.getDate()
                ).padStart(2, '0');

            return `${year}-${month}-${day}`;
        }


        closeStatisticsButton.addEventListener(
            'click',
            () => {

                statisticsScreen.classList.remove(
                    'css-active'
                );
            }
        );


        /* =========================
           NEXT ID
           ========================= */

        function getNextId() {

            const forms =
                loadForms();

            const ids =
                Object.keys(forms)
                    .map(Number)
                    .filter(Number.isFinite);

            if (ids.length === 0) {
                return 1;
            }

            return Math.max(...ids) + 1;
        }


        /* =========================
           ADD FORM
           ========================= */

        addButton.addEventListener(
            'click',
            () => {

                const id =
                    getNextId();

                const data = {
                    hold: 1,
                    rest: 1,
                    repeat: 1,
                    dayGoal: null,
                    history: {}
                };

                const forms =
                    loadForms();

                forms[id] =
                    data;

                saveForms(forms);

                createForm(
                    id,
                    data
                );
            }
        );


        /* =========================
           RESTORE FORMS
           ========================= */

        function restoreForms() {

            const forms =
                loadForms();

            const ids =
                Object.keys(forms)
                    .sort(
                        (a, b) =>
                            Number(a) -
                            Number(b)
                    );


            if (ids.length === 0) {

                const data = {
                    hold: 1,
                    rest: 1,
                    repeat: 1,
                    dayGoal: null,
                    history: {}
                };

                forms[1] =
                    data;

                saveForms(forms);

                createForm(
                    1,
                    data
                );

                return;
            }


            ids.forEach(id => {

                const data =
                    forms[id];

                if (
                    data.dayGoal === undefined
                ) {
                    data.dayGoal = null;
                }

                if (
                    !data.history
                ) {
                    data.history = {};
                }

                createForm(
                    id,
                    data
                );
            });


            saveForms(forms);
        }


        /* =========================
           TIMER
           ========================= */

        function startExercise(settings) {

            clearInterval(timer);

            timerScreen.classList.add(
                'css-active'
            );

            successDisplay.hidden =
                true;

            readyDisplay.hidden =
                true;

            countdownDisplay.hidden =
                false;

            circle.className =
                'css-circle css-ready';

            progress.style.strokeDashoffset =
                circumference;

            phaseDisplay.textContent =
                'Ready?';


            runReadyCountdown(
                3,
                () => {

                    runRepeat(
                        1,
                        settings.repeat,
                        settings.hold,
                        settings.rest
                    );
                }
            );
        }


        function runReadyCountdown(
            seconds,
            onComplete
        ) {

            clearInterval(timer);

            phaseDisplay.textContent =
                'Ready?';

            circle.className =
                'css-circle css-ready';

            let remaining =
                seconds;

            countdownDisplay.hidden =
                false;

            readyDisplay.hidden =
                true;

            countdownDisplay.textContent =
                remaining;

            const startTime =
                Date.now();


            function update() {

                const elapsed =
                    Date.now() -
                    startTime;

                const current =
                    Math.ceil(
                        seconds -
                        elapsed / 1000
                    );


                if (
                    current !== remaining
                ) {

                    remaining =
                        Math.max(
                            0,
                            current
                        );

                    countdownDisplay.textContent =
                        remaining;
                }


                if (
                    elapsed >=
                    seconds * 1000
                ) {

                    clearInterval(timer);

                    countdownDisplay.textContent =
                        '';

                    onComplete();
                }
            }


            timer =
                setInterval(
                    update,
                    30
                );

            update();
        }


        function runRepeat(
            currentRepeat,
            totalRepeats,
            hold,
            rest
        ) {

            repeatDisplay.textContent =
                `Repeat ${currentRepeat} / ${totalRepeats}`;

            runPhase(
                'Hold',
                hold,
                'hold',
                () => {

                    if (currentRepeat < totalRepeats) {
                        runPhase(
                            'Rest',
                            rest,
                            'rest',
                            () => {
                                runRepeat(
                                    currentRepeat + 1,
                                    totalRepeats,
                                    hold,
                                    rest
                                );
                            }
                        );
                    } else {
                        // No rest after the final hold.
                        showSuccess();
                    }
                }
            );
        }


        function runPhase(
            phase,
            duration,
            phaseClass,
            onComplete
        ) {

            clearInterval(timer);

            phaseDisplay.textContent =
                phase;

            countdownDisplay.hidden =
                false;

            readyDisplay.hidden =
                true;

            successDisplay.hidden =
                true;

            circle.className =
                `css-circle css-${phaseClass}`;


            const startTime =
                Date.now();

            const durationMs =
                duration * 1000;


            function update() {

                const elapsed =
                    Date.now() -
                    startTime;

                const remainingMs =
                    Math.max(
                        0,
                        durationMs -
                        elapsed
                    );

                const remainingSeconds =
                    Math.ceil(
                        remainingMs /
                        1000
                    );

                countdownDisplay.textContent =
                    remainingSeconds;


                const progressAmount =
                    1 -
                    (
                        remainingMs /
                        durationMs
                    );

                progress.style.strokeDashoffset =
                    circumference *
                    progressAmount;


                if (
                    remainingMs <= 0
                ) {

                    clearInterval(timer);

                    progress.style.strokeDashoffset =
                        circumference;

                    onComplete();
                }
            }


            update();

            timer =
                setInterval(
                    update,
                    50
                );
        }


        function showSuccess() {

            clearInterval(timer);

            phaseDisplay.textContent =
                '';

            countdownDisplay.hidden =
                true;

            readyDisplay.hidden =
                true;

            successDisplay.hidden =
                false;

            circle.className =
                'css-circle css-ready';

            progress.style.strokeDashoffset =
                circumference;

            repeatDisplay.textContent =
                '';


            setTimeout(
                () => {

                    timerScreen.classList.remove(
                        'css-active'
                    );

                    countdownDisplay.hidden =
                        false;

                    successDisplay.hidden =
                        true;

                    phaseDisplay.textContent =
                        'Ready?';

                    circle.className =
                        'css-circle css-ready';

                    progress.style.strokeDashoffset =
                        circumference;

                },
                1800
            );
        }


        /* =========================
           START
           ========================= */

        restoreForms();

    </script>

</body>
</html>
